# Release do daemon: build reproduzível → checksum → SLSA provenance (keyless,
# via OIDC — SEM chave privada no CI) → GitHub Release. Dispara em tag `daemon-v*`.
#
# Autenticidade do Release = provenance SLSA (verifique com `gh attestation
# verify <arquivo> --repo rlisboar/the-dudes-daemon`).
# A assinatura Ed25519 dos bundles SERVIDOS pelo orchestrator é feita offline
# no host de build (chave privada nunca entra no CI) — ver signing-pub.pem.
name: release

on:
  push:
    tags:
      - "daemon-v*"
  workflow_dispatch:

permissions:
  contents: write        # criar Release
  id-token: write        # provenance (OIDC, keyless)
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install (locked, reproduzível)
        run: npm ci

      - name: Build (limpo, sem telemetria embedada)
        run: npm run build:legacy

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum daemon.cjs > daemon.cjs.sha256
          sha256sum mcp-bridge.cjs > mcp-bridge.cjs.sha256

      - name: Provenance SLSA (keyless)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/daemon.cjs, dist/mcp-bridge.cjs"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/daemon.cjs
            dist/daemon.cjs.sha256
            dist/mcp-bridge.cjs
            dist/mcp-bridge.cjs.sha256
            signing-pub.pem
